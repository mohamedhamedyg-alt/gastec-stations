<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تم إيقاف التطبيق</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap');
*{box-sizing:border-box;font-family:Cairo,sans-serif}
html,body{height:100%}
body{margin:0;background:linear-gradient(135deg,#0D2B4E,#1A4A7A);color:#0F2A47;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#fff;max-width:440px;width:100%;border-radius:20px;box-shadow:0 18px 50px rgba(0,0,0,.35);overflow:hidden;text-align:center}
.top{background:linear-gradient(135deg,#B91C1C,#DC2626);color:#fff;padding:26px 20px}
.lock{font-size:52px;line-height:1}
.top h1{margin:12px 0 0;font-size:22px;font-weight:900}
.body{padding:26px 24px 30px}
.msg{font-size:17px;font-weight:800;color:#0F2A47;line-height:1.9}
.sub{margin-top:14px;font-size:13.5px;font-weight:700;color:#64748B;line-height:1.9}
.rule{height:1px;background:#E7EBF3;margin:20px 0}
.foot{font-size:12px;font-weight:700;color:#94A3B8}
</style></head><body>
<div class="card">
  <div class="top">
    <div class="lock">🔒</div>
    <h1>تم إيقاف التطبيق</h1>
  </div>
  <div class="body">
    <div class="msg">تم غلق التطبيق بناءً على تعليمات الإدارة العليا.</div>
    <div class="sub">نشكر لكم تعاونكم. برجاء الرجوع إلى الإدارة المختصة بخصوص القناة البديلة المعتمدة لإدخال ومتابعة البيانات وحظر نشر أو تجميع الداتا من الواتساب نهائياً ويقتصر فقط ذلك على الساب الخاص بالشركة.</div>
  </div>
</div>
</body></html>
